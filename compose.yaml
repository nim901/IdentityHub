services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
  mock-atlassian:
    profiles: ["mock"]
    build:
      context: .
      target: mock
    ports:
      - "4010:4010"
volumes:
  app-data:
